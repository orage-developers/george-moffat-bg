<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data</title>
<!-- Blank data starter: two sheets, number/text types, formulas, total row. XLSX, CSV and PDF. -->
<style>
  /* Styling only affects the PDF of this HTML. XLSX and CSV read the tables.
     George W. Moffat brand: colors per rules/brand.md, fonts and voice per BRAND-GUIDELINES.md. */
  @font-face { font-family: "Anton"; src: url("brand://fonts/Anton-Regular.ttf"); }
  @font-face { font-family: "Bebas Neue"; src: url("brand://fonts/BebasNeue-Regular.ttf"); }
  @page {
    size: Letter landscape; margin: 0.6in 0.6in 0.8in; background: #010101;
    @bottom-center { content: "GEORGE W. MOFFAT · THE AI RUNDOWN · ORAGE AI AGENCY"; font-family: "Bebas Neue", Impact, sans-serif; font-size: 9pt; letter-spacing: 2px; color: #8A8A8A; }
  }
  html, body { background: #010101; }
  body { font-family: "Bebas Neue", Impact, "Arial Narrow", sans-serif; font-size: 11pt; letter-spacing: 0.5px; text-transform: uppercase; color: #C8C8C8; margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  header { display: flex; align-items: baseline; gap: 12pt; padding: 6pt 0; }
  header .wm { font-family: "Anton", Impact, sans-serif; font-size: 20pt; letter-spacing: 3px; color: #FFFFFF; text-shadow: 0 0 16px rgba(255,255,255,0.2); }
  header .tl { font-size: 10pt; letter-spacing: 4px; color: #8A8A8A; }
  /* Compact header: small wordmark, right-aligned. */
  header.compact { justify-content: flex-end; padding: 4pt 0; }
  header.compact .wm { font-size: 11pt; text-shadow: none; }
  header.compact .tl { display: none; }
  /* % change tiles (PDF only). */
  .tiles { display: flex; gap: 8pt; margin: 14pt 0 0; }
  .tile { flex: 1; background: #0C0C0C; border: 1px solid #262626; border-left: 3px solid #FFFFFF; border-radius: 4px; padding: 8pt 10pt; }
  .tile .label { font-size: 9.5pt; letter-spacing: 2px; color: #8A8A8A; margin: 0; }
  .tile .pct { font-family: "Anton", Impact, sans-serif; font-size: 24pt; letter-spacing: 1px; color: #FFFFFF; margin: 3pt 0; line-height: 1; text-shadow: 0 0 14px rgba(255,255,255,0.2); }
  .tile .from { font-size: 9.5pt; color: #8A8A8A; margin: 0; }
  td.pct { color: #FFFFFF; }
  table { width: 100%; border-collapse: collapse; margin: 14pt 0; }
  caption { font-size: 16pt; letter-spacing: 3px; color: #FFFFFF; text-align: left; padding-bottom: 3pt; border-bottom: 1px solid #333333; margin-bottom: 6pt; }
  th { background: #151515; color: #FFFFFF; font-weight: normal; letter-spacing: 2px; text-align: left; padding: 5pt 7pt; }
  td { background: #0C0C0C; border-bottom: 1px solid #262626; padding: 5pt 7pt; }
  tr.total td { color: #FFFFFF; border-top: 1px solid #FFFFFF; }
  .key { color: #FFFFFF; text-shadow: 0 0 10px rgba(255,255,255,0.35); }
  .note { font-size: 9.5pt; color: #8A8A8A; margin: 4pt 0 0; }
</style>
</head>
<body>
  <header class="compact"><span class="wm">GEORGE W. MOFFAT</span><span class="tl">The AI Rundown · Orage AI Agency</span></header>

  <!-- Each top-level <table> = one XLSX sheet / one CSV file. <caption> titles it in the PDF. -->
  <table data-sheet="Sales">
    <caption>Sales</caption>
    <tr><th>Product</th><th>Units</th><th>Price</th><th>Total</th><th>Code</th></tr>
    <tr><td>Product A</td><td>12</td><td>19.90</td><td data-formula="=B2*C2">238.80</td><td data-type="text">007</td></tr>
    <tr><td>Product B</td><td>5</td><td>14.50</td><td data-formula="=B3*C3">72.50</td><td data-type="text">012</td></tr>
    <tr class="total"><td>Total</td><td data-formula="=SUM(B2:B3)">17</td><td></td><td class="key" data-formula="=SUM(D2:D3)">311.30</td><td></td></tr>
  </table>

  <table data-sheet="Notes">
    <caption>Notes</caption>
    <tr><th>Date</th><th>Note</th></tr>
    <tr><td data-type="text">2026-01-15</td><td>First line<br>Second line</td></tr>
  </table>
  <p class="note">Text outside the tables appears only in the PDF.</p>
</body>
</html>
